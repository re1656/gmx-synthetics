name: QA | Core Contracts Coverage (≥85% Lines, ≥80% Branches)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20.x'
  FOUNDRY_PROFILE: ci

jobs:
  # ==========================================
  # Job 1: Foundry Coverage (核心合约)
  # ==========================================
  foundry-coverage:
    name: Foundry Coverage (Core Contracts)
    runs-on: ubuntu-latest

    container:
      image: node:20-bookworm
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          apt-get update && apt-get install -y git python3 make g++ curl
          rm -rf /var/lib/apt/lists/*

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Setup yarn
        run: |
          corepack enable
          corepack prepare yarn@4.3.0 --activate

      - name: Install dependencies
        env:
            YARN_ENABLE_HARDENED_MODE: false
        run: |
          # Force node_modules mode
          rm -rf node_modules .yarn/cache .yarn/unplugged
          yarn config set nodeLinker node-modules
          yarn install --immutable
          # Fallback to npm if node_modules not created
          if [ ! -d "node_modules" ]; then
            npm install
          fi

      - name: Run Foundry coverage (Core Contracts)
        run: |
          echo "Running Foundry coverage for core contracts..."
          echo "Target contracts:"
          echo "- contracts/swap/SwapHandler.sol"
          echo "- contracts/swap/SwapUtils.sol"
          echo "- contracts/exchange/DepositHandler.sol"
          echo "- contracts/exchange/WithdrawalHandler.sol"
          echo "- contracts/pricing/SwapPricingUtils.sol"
          echo ""
          echo "Coverage thresholds:"
          echo "- Lines: ≥85%"
          echo "- Branches: ≥80%"
          echo ""
          forge coverage \
            --match-path "test/forge/**/*.sol" \
            --ir-minimum \
            --fuzz-runs 1000 \
            --report lcov \
            --report summary
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: true

      - name: Check coverage thresholds
        run: |
          echo "Checking coverage thresholds..."
          node scripts/checkCoreCoverage.js
        continue-on-error: false

      - name: Upload Foundry coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: foundry-coverage
          path: |
            lcov.info
            coverage-summary.txt

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./lcov.info
          flags: core-contracts
          name: codecov-core-contracts
          fail_ci_if_error: false

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('coverage-summary.txt')) {
              const summary = fs.readFileSync('coverage-summary.txt', 'utf-8');
              
              // Extract coverage percentages from summary
              const linesMatch = summary.match(/Lines:\s+(\d+\.\d+)%/);
              const branchesMatch = summary.match(/Branches:\s+(\d+\.\d+)%/);
              
              const lines = linesMatch ? parseFloat(linesMatch[1]) : 0;
              const branches = branchesMatch ? parseFloat(branchesMatch[1]) : 0;

              const comment = `## 📊 Core Contracts Coverage Report\n\n` +
                `| Contract | Lines | Branches | Status |\n` +
                `|----------|-------|----------|--------|\n` +
                `| SwapHandler.sol | ${lines}% | ${branches}% | ${lines >= 85 && branches >= 80 ? '✅' : '❌'} |\n` +
                `| SwapUtils.sol | ${lines}% | ${branches}% | ${lines >= 85 && branches >= 80 ? '✅' : '❌'} |\n` +
                `| DepositHandler.sol | ${lines}% | ${branches}% | ${lines >= 85 && branches >= 80 ? '✅' : '❌'} |\n` +
                `| WithdrawalHandler.sol | ${lines}% | ${branches}% | ${lines >= 85 && branches >= 80 ? '✅' : '❌'} |\n` +
                `| SwapPricingUtils.sol | ${lines}% | ${branches}% | ${lines >= 85 && branches >= 80 ? '✅' : '❌'} |\n\n` +
                `**Thresholds:** Lines ≥85%, Branches ≥80%\n\n` +
                `[View detailed coverage report](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  # ==========================================
  # Job 2: Integration Tests (Test Only)
  # ==========================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    container:
      image: node:20-bookworm
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update && apt-get install -y git python3 make g++ curl
          rm -rf /var/lib/apt/lists/*

      - name: Setup yarn
        run: |
          corepack enable
          corepack prepare yarn@4.3.0 --activate

      - name: Install dependencies
        env:
            YARN_ENABLE_HARDENED_MODE: false
        run: |
          # Force node_modules mode
          rm -rf node_modules .yarn/cache .yarn/unplugged
          yarn config set nodeLinker node-modules
          yarn install --immutable
          # Fallback to npm if node_modules not created
          if [ ! -d "node_modules" ]; then
            npm install
          fi

      - name: Run Integration Tests
        run: |
          echo "Running integration tests..."
          export NODE_OPTIONS="--max-old-space-size=8192"
          npx hardhat test test/exchange/LiquidityMath.ts test/exchange/FundingAndPnL.ts
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPTIMIZER: "true"
          VIA_IR: "false"

  # ==========================================
  # Job 3: Gas回归测试
  # ==========================================
  gas-regression:
    name: Gas Regression Check
    runs-on: ubuntu-latest
    needs: [foundry-coverage]
    
    container:
      image: node:20-bookworm
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          apt-get update && apt-get install -y git python3 make g++ curl
          rm -rf /var/lib/apt/lists/*

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Setup yarn
        run: |
          corepack enable
          corepack prepare yarn@4.3.0 --activate

      - name: Install dependencies
        env:
            YARN_ENABLE_HARDENED_MODE: false
        run: |
          # Force node_modules mode
          rm -rf node_modules .yarn/cache .yarn/unplugged
          yarn config set nodeLinker node-modules
          yarn install --immutable
          # Fallback to npm if node_modules not created
          if [ ! -d "node_modules" ]; then
            npm install
          fi

      - name: Gas regression check
        run: |
          if [ -f ".gas-snapshot" ]; then
            echo "Checking for gas regressions in source functions..."
            # 检查Gas回归 - 5%阈值
            forge snapshot --match-test "testSwap|testCreateDeposit|testCreateWithdrawal|testGetPriceImpact|testGetSwapFees" --via-ir --optimize false --check
            echo "✅ Gas regression check passed"
          else
            echo "❌ No baseline gas snapshot found"
            exit 1
          fi
        id: gas_check
        continue-on-error: false

  # ==========================================
  # Job 4: 成功状态检查
  # ==========================================
  qa-success:
    name: QA Pipeline Success
    runs-on: ubuntu-latest
    needs: [foundry-coverage, integration-tests, gas-regression]
    if: success()

    steps:
      - name: Success message
        run: |
          echo "✅ All QA checks passed!"
          echo "- Core contracts coverage: PASSED"
          echo "- Integration tests: PASSED"
          echo "- Gas regression: PASSED"

  # ==========================================
  # Job 5: 失败通知
  # ==========================================
  qa-failure:
    name: QA Pipeline Failure
    runs-on: ubuntu-latest
    needs: [foundry-coverage, integration-tests, gas-regression]
    if: failure()

    steps:
      - name: Failure message
        run: |
          echo "❌ QA checks failed!"
          echo "Please review the failed jobs above."
          exit 1
