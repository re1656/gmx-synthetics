name: QA | Swap & Liquidity Coverage (≥ 90%)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20.x'
  FOUNDRY_PROFILE: ci

jobs:
  # ==========================================
  # Job 1: Foundry测试（单元测试 + Fuzz测试）
  # ==========================================
  foundry-tests:
    name: Foundry Tests (Unit + Fuzz)
    runs-on: ubuntu-latest
    
    container:
      image: node:20-bookworm
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          apt-get update && apt-get install -y git python3 make g++ curl
          rm -rf /var/lib/apt/lists/*

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Setup yarn
        run: |
          corepack enable
          corepack prepare yarn@4.3.0 --activate

      - name: Install dependencies
        env:
            YARN_ENABLE_HARDENED_MODE: false
        run: |
          # Force node_modules mode
          rm -rf node_modules .yarn/cache .yarn/unplugged
          yarn config set nodeLinker node-modules
          yarn install --immutable
          # Fallback to npm if node_modules not created
          if [ ! -d "node_modules" ]; then
            npm install
          fi

      - name: Run Foundry build
        run: |
          forge --version
          forge build --via-ir --optimize false -vv
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: true
        id: build

      - name: Run Foundry tests
        run: |
          forge test --match-path "test/forge/**/*.sol" --no-match-test "testFuzz" --via-ir --optimize false  -vvv
        id: test

      - name: Run Foundry fuzz tests (1000 runs)
        run: |
          forge test --match-test "testFuzz" --via-ir --optimize false --fuzz-runs 1000 -vv
        id: fuzz



  # ==========================================
  # Job 2: Hardhat测试（集成测试）
  # ==========================================
  hardhat-tests:
    name: Hardhat Tests (Integration)
    runs-on: ubuntu-latest
    
    container:
      image: node:20-bookworm
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update && apt-get install -y git python3 make g++ curl
          rm -rf /var/lib/apt/lists/*

      - name: Setup yarn
        run: |
          corepack enable
          corepack prepare yarn@4.3.0 --activate

      - name: Install dependencies
        env:
            YARN_ENABLE_HARDENED_MODE: false
        run: |
          # Force node_modules mode
          rm -rf node_modules .yarn/cache .yarn/unplugged
          yarn config set nodeLinker node-modules
          yarn install --immutable
          # Fallback to npm if node_modules not created
          if [ ! -d "node_modules" ]; then
            npm install
          fi

      - name: Compile contracts
        run: npx hardhat compile
        env:
          OPTIMIZER: "false"
          VIA_IR: "true"

      - name: Run Hardhat tests
        run: |
          export NODE_OPTIONS="--max-old-space-size=8192"
          npx hardhat test
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPTIMIZER: "false"
          VIA_IR: "true"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardhat-test-results
          path: test-results/

  # ==========================================
  # Job 3: Coverage测试（覆盖率检查）
  # ==========================================
  coverage:
    name: Coverage Analysis
    runs-on: ubuntu-latest
    needs: [foundry-tests, hardhat-tests]
    
    container:
      image: node:20-bookworm
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update && apt-get install -y git python3 make g++ curl
          rm -rf /var/lib/apt/lists/*

      - name: Setup yarn
        run: |
          corepack enable
          corepack prepare yarn@4.3.0 --activate

      - name: Install dependencies
        env:
            YARN_ENABLE_HARDENED_MODE: false
        run: |
          # Force node_modules mode
          rm -rf node_modules .yarn/cache .yarn/unplugged
          yarn config set nodeLinker node-modules
          yarn install --immutable
          # Fallback to npm if node_modules not created
          if [ ! -d "node_modules" ]; then
            npm install
          fi 

      - name: Run coverage
        run: |
          export NODE_OPTIONS="--max-old-space-size=8192"
          npx hardhat coverage
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPTIMIZER: "true"
          VIA_IR: "false"

      - name: Check coverage thresholds
        run: |
          node scripts/checkCoverage.js
        continue-on-error: false

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Generate coverage badge
        run: |
          echo "Generating coverage badge..."
          # Extract coverage percentage from report
          if [ -f "coverage/coverage-summary.json" ]; then
            COVERAGE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json')).total.lines.pct)")
            echo "Coverage: ${COVERAGE}%"
            echo "COVERAGE=${COVERAGE}" >> $GITHUB_ENV
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('coverage/coverage-summary.json')) {
              const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json'));
              const lines = coverage.total.lines.pct;
              const branches = coverage.total.branches.pct;
              const functions = coverage.total.functions.pct;

              const comment = `## 📊 Coverage Report\n\n` +
                `| Metric | Coverage | Target | Status |\n` +
                `|--------|----------|--------|--------|\n` +
                `| Lines | ${lines}% | 90% | ${lines >= 90 ? '✅' : '❌'} |\n` +
                `| Branches | ${branches}% | 80% | ${branches >= 80 ? '✅' : '❌'} |\n` +
                `| Functions | ${functions}% | 85% | ${functions >= 85 ? '✅' : '❌'} |\n\n` +
                `[View detailed coverage report](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  # ==========================================
  # Job 4: Gas回归测试
  # ==========================================
  gas-regression:
    name: Gas Regression Check
    runs-on: ubuntu-latest
    needs: [foundry-tests]
    
    container:
      image: node:20-bookworm
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          apt-get update && apt-get install -y git python3 make g++ curl
          rm -rf /var/lib/apt/lists/*

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Setup yarn
        run: |
          corepack enable
          corepack prepare yarn@4.3.0 --activate

      - name: Install dependencies
        env:
            YARN_ENABLE_HARDENED_MODE: false
        run: |
          # Force node_modules mode
          rm -rf node_modules .yarn/cache .yarn/unplugged
          yarn config set nodeLinker node-modules
          yarn install --immutable
          # Fallback to npm if node_modules not created
          if [ ! -d "node_modules" ]; then
            npm install
          fi

      - name: Gas regression check
        run: |
          if [ -f ".gas-snapshot" ]; then
            echo "Checking for gas regressions in source functions..."
            # 检查Gas回归 - 5%阈值
            forge snapshot --match-test "testSwap|testCreateDeposit|testCreateWithdrawal|testGetPriceImpact|testGetSwapFees" --via-ir --optimize false --check
            echo "✅ Gas regression check passed"
          else
            echo "❌ No baseline gas snapshot found"
            exit 1
          fi
        id: gas_check
        continue-on-error: true

      # - name: Upload gas comparison
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: gas-comparison
      #     path: .gas-snapshot


  # ==========================================
  # Job 5: 成功状态检查
  # ==========================================
  qa-success:
    name: QA Pipeline Success
    runs-on: ubuntu-latest
    needs: [foundry-tests, hardhat-tests, coverage, gas-regression]
    if: success()

    steps:
      - name: Success message
        run: |
          echo "✅ All QA checks passed!"
          echo "- Foundry tests: PASSED"
          echo "- Hardhat tests: PASSED"
          echo "- Coverage targets: MET"
          echo "- Gas regression: PASSED"

  # ==========================================
  # Job 6: 失败通知
  # ==========================================
  qa-failure:
    name: QA Pipeline Failure
    runs-on: ubuntu-latest
    needs: [foundry-tests, hardhat-tests, coverage, gas-regression]
    if: failure()

    steps:
      - name: Failure message
        run: |
          echo "❌ QA checks failed!"
          echo "Please review the failed jobs above."
          exit 1
