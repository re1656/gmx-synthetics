name: QA | Swap & Liquidity Coverage (≥ 90%)

on:
  push:
    branches: [ main, 'qa/**' ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20.x'
  FOUNDRY_PROFILE: ci

jobs:
  # ==========================================
  # Job 1: Foundry测试（单元测试 + Fuzz测试）
  # ==========================================
  foundry-tests:
    name: Foundry Tests (Unit + Fuzz)
    runs-on: ubuntu-latest
    
    container:
      image: node:20-bookworm
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          apt-get update && apt-get install -y git python3 make g++ curl
          rm -rf /var/lib/apt/lists/*

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Setup yarn
        run: |
          corepack enable
          corepack prepare yarn@4.3.0 --activate

      - name: Run Foundry build
        run: |
          forge --version
          forge build --sizes
        id: build

      - name: Run Foundry tests
        run: |
          forge test -vvv
        id: test

      - name: Run Foundry fuzz tests (1000 runs)
        run: |
          forge test --match-test "testFuzz" --fuzz-runs 1000 -vv
        id: fuzz

      - name: Check gas regression (±5% threshold)
        run: |
          # 检查 gas 回归 - 如果任何函数超过 +5% 基线则失败
          if [ -f .gas-snapshot ]; then
            echo "📊 Checking gas regression against baseline..."
            forge snapshot --match-path "test/forge/**/*.sol" --check .gas-snapshot || {
              echo "❌ Gas regression detected! Functions exceed +5% threshold."
              echo "Run 'forge snapshot --diff .gas-snapshot' to see details."
              exit 1
            }
            echo "✅ Gas check passed - no regression detected"
          else
            echo "⚠️  No baseline found, creating new baseline..."
            forge snapshot --match-path "test/forge/**/*.sol" --snap .gas-snapshot
            echo "📝 New gas baseline created"
          fi
        continue-on-error: false
        id: gas_check

      - name: Upload gas snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gas-snapshot
          path: .gas-snapshot

  # ==========================================
  # Job 2: Hardhat测试（集成测试）
  # ==========================================
  hardhat-tests:
    name: Hardhat Tests (Integration)
    runs-on: ubuntu-latest
    
    container:
      image: node:20-bookworm
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update && apt-get install -y git python3 make g++ curl
          rm -rf /var/lib/apt/lists/*

      - name: Setup yarn
        run: |
          corepack enable
          corepack prepare yarn@4.3.0 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Compile contracts
        run: yarn hardhat compile

      - name: Run Hardhat tests
        run: |
          export NODE_OPTIONS="--max-old-space-size=8192"
          yarn hardhat test
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardhat-test-results
          path: test-results/

  # ==========================================
  # Job 3: Coverage测试（覆盖率检查）
  # ==========================================
  coverage:
    name: Coverage Analysis
    runs-on: ubuntu-latest
    needs: [foundry-tests, hardhat-tests]
    
    container:
      image: node:20-bookworm
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update && apt-get install -y git python3 make g++ curl
          rm -rf /var/lib/apt/lists/*

      - name: Setup yarn
        run: |
          corepack enable
          corepack prepare yarn@4.3.0 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run coverage
        run: |
          export NODE_OPTIONS="--max-old-space-size=8192"
          yarn hardhat coverage
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Check coverage thresholds
        run: |
          node scripts/checkCoverage.js
        continue-on-error: false

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Generate coverage badge
        run: |
          echo "Generating coverage badge..."
          # Extract coverage percentage from report
          if [ -f "coverage/coverage-summary.json" ]; then
            COVERAGE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json')).total.lines.pct)")
            echo "Coverage: ${COVERAGE}%"
            echo "COVERAGE=${COVERAGE}" >> $GITHUB_ENV
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('coverage/coverage-summary.json')) {
              const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json'));
              const lines = coverage.total.lines.pct;
              const branches = coverage.total.branches.pct;
              const functions = coverage.total.functions.pct;

              const comment = `## 📊 Coverage Report\n\n` +
                `| Metric | Coverage | Target | Status |\n` +
                `|--------|----------|--------|--------|\n` +
                `| Lines | ${lines}% | 90% | ${lines >= 90 ? '✅' : '❌'} |\n` +
                `| Branches | ${branches}% | 80% | ${branches >= 80 ? '✅' : '❌'} |\n` +
                `| Functions | ${functions}% | 85% | ${functions >= 85 ? '✅' : '❌'} |\n\n` +
                `[View detailed coverage report](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  # ==========================================
  # Job 4: Gas回归测试
  # ==========================================
  gas-regression:
    name: Gas Regression Check
    runs-on: ubuntu-latest
    needs: [foundry-tests]
    
    container:
      image: node:20-bookworm
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          apt-get update && apt-get install -y git python3 make g++ curl
          rm -rf /var/lib/apt/lists/*

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run gas snapshot (监控源码函数)
        run: |
          # 建立Gas基线 - 监控关键源码函数调用
          forge snapshot --match-test "testSwap|testCreateDeposit|testCreateWithdrawal|testGetPriceImpact|testGetSwapFees" --via-ir > .gas-snapshot
          echo "Gas baseline created for source functions:"
          echo "- SwapHandler.swap() → SwapUtils.swap() → SwapUtils._swap()"
          echo "- DepositHandler.createDeposit()"
          echo "- WithdrawalHandler.createWithdrawal()"
          echo "- SwapPricingUtils.getPriceImpactUsd()"
          echo "- SwapPricingUtils.getSwapFees()"
        id: gas_baseline

      - name: Check gas regression
        run: |
          if [ -f ".gas-snapshot" ]; then
            echo "Checking for gas regressions in source functions..."
            # 检查Gas回归 - 5%阈值
            forge snapshot --match-test "testSwap|testCreateDeposit|testCreateWithdrawal|testGetPriceImpact|testGetSwapFees" --via-ir --check
            echo "✅ Gas regression check passed"
          else
            echo "❌ No baseline gas snapshot found"
            exit 1
          fi
        id: gas_check
        continue-on-error: true

      - name: Upload gas comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gas-comparison
          path: .gas-snapshot

  # ==========================================
  # Job 5: 静态分析 (可选，但推荐)
  # ==========================================
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    
    container:
      image: node:20-bookworm
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update && apt-get install -y git python3 make g++ curl
          rm -rf /var/lib/apt/lists/*

      - name: Setup yarn
        run: |
          corepack enable
          corepack prepare yarn@4.3.0 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Slither
        uses: crytic/slither-action@v0.3.0
        continue-on-error: true
        with:
          target: 'contracts/'
          slither-args: '--filter-paths "contracts/mock|contracts/test" --exclude naming-convention,external-function,low-level-calls'
          fail-on: medium

  # ==========================================
  # Job 6: 生成测试报告
  # ==========================================
  test-report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs: [foundry-tests, hardhat-tests, coverage]
    if: always()
    
    container:
      image: node:20-bookworm
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update && apt-get install -y git python3 make g++ curl
          rm -rf /var/lib/apt/lists/*

      - name: Setup yarn
        run: |
          corepack enable
          corepack prepare yarn@4.3.0 --activate

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate comprehensive test report
        run: |
          node scripts/generateTestReport.js
        continue-on-error: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report/

  # ==========================================
  # Job 7: 成功状态检查
  # ==========================================
  qa-success:
    name: QA Pipeline Success
    runs-on: ubuntu-latest
    needs: [foundry-tests, hardhat-tests, coverage, gas-regression]
    if: success()

    steps:
      - name: Success message
        run: |
          echo "✅ All QA checks passed!"
          echo "- Foundry tests: PASSED"
          echo "- Hardhat tests: PASSED"
          echo "- Coverage targets: MET"
          echo "- Gas regression: PASSED"

  # ==========================================
  # Job 8: 失败通知
  # ==========================================
  qa-failure:
    name: QA Pipeline Failure
    runs-on: ubuntu-latest
    needs: [foundry-tests, hardhat-tests, coverage, gas-regression]
    if: failure()

    steps:
      - name: Failure message
        run: |
          echo "❌ QA checks failed!"
          echo "Please review the failed jobs above."
          exit 1
