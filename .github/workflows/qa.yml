name: QA | Swap & Liquidity Coverage (≥ 90%)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20.x'
  FOUNDRY_PROFILE: ci

jobs:
  # ==========================================
  # Job 1: Foundry Coverage (单元测试 + Fuzz测试)
  # ==========================================
  foundry-coverage:
    name: Foundry Coverage (Unit + Fuzz)
    runs-on: ubuntu-latest

    container:
      image: node:20-bookworm
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          apt-get update && apt-get install -y git python3 make g++ curl
          rm -rf /var/lib/apt/lists/*

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Setup yarn
        run: |
          corepack enable
          corepack prepare yarn@4.3.0 --activate

      - name: Install dependencies
        env:
            YARN_ENABLE_HARDENED_MODE: false
        run: |
          # Force node_modules mode
          rm -rf node_modules .yarn/cache .yarn/unplugged
          yarn config set nodeLinker node-modules
          yarn install --immutable
          # Fallback to npm if node_modules not created
          if [ ! -d "node_modules" ]; then
            npm install
          fi

      - name: Run Foundry coverage
        run: |
          echo "Running Foundry coverage (Unit tests + Fuzz tests with 1000 runs)..."
          forge coverage --match-path "test/forge/**/*.sol" --ir-minimum --fuzz-runs 1000 --report lcov
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: true

      - name: Upload Foundry coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: foundry-coverage
          path: lcov.info

  # ==========================================
  # Job 2: Hardhat Coverage (集成测试)
  # ==========================================
  hardhat-coverage:
    name: Hardhat Coverage (Integration)
    runs-on: ubuntu-latest

    container:
      image: node:20-bookworm
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update && apt-get install -y git python3 make g++ curl
          rm -rf /var/lib/apt/lists/*

      - name: Setup yarn
        run: |
          corepack enable
          corepack prepare yarn@4.3.0 --activate

      - name: Install dependencies
        env:
            YARN_ENABLE_HARDENED_MODE: false
        run: |
          # Force node_modules mode
          rm -rf node_modules .yarn/cache .yarn/unplugged
          yarn config set nodeLinker node-modules
          yarn install --immutable
          # Fallback to npm if node_modules not created
          if [ ! -d "node_modules" ]; then
            npm install
          fi

      - name: Run Hardhat coverage
        run: |
          echo "Running Hardhat coverage (Integration tests)..."
          export NODE_OPTIONS="--max-old-space-size=8192"
          npx hardhat coverage --testfiles "test/exchange/LiquidityMath.ts,test/exchange/FundingAndPnL.ts"
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPTIMIZER: "false"
          VIA_IR: "true"

      - name: Upload Hardhat coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: hardhat-coverage
          path: coverage/lcov.info

  # ==========================================
  # Job 3: 合并覆盖率并检查阈值
  # ==========================================
  merge-coverage:
    name: Merge Coverage & Check Thresholds
    runs-on: ubuntu-latest
    needs: [foundry-coverage, hardhat-coverage]

    container:
      image: node:20-bookworm
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install lcov
        run: |
          apt-get update && apt-get install -y lcov
          rm -rf /var/lib/apt/lists/*

      - name: Download Foundry coverage
        uses: actions/download-artifact@v4
        with:
          name: foundry-coverage
          path: ./

      - name: Download Hardhat coverage
        uses: actions/download-artifact@v4
        with:
          name: hardhat-coverage
          path: ./coverage/

      - name: Merge coverage reports
        run: |
          echo "Merging coverage reports..."
          # Foundry lcov.info is in root
          mv lcov.info lcov_foundry.info
          echo "✓ Foundry coverage: lcov_foundry.info"

          # Hardhat lcov.info is in coverage/
          cp coverage/lcov.info lcov_hardhat.info
          echo "✓ Hardhat coverage: lcov_hardhat.info"

          # Merge using lcov
          lcov \
            -a lcov_foundry.info \
            -a lcov_hardhat.info \
            -o lcov_merged.info \
            --rc lcov_branch_coverage=1

          echo "✓ Coverage reports merged: lcov_merged.info"

          # Generate merged HTML report
          genhtml lcov_merged.info -o coverage_merged --branch-coverage
          echo "✓ Generated merged HTML report: coverage_merged/"

      - name: Check coverage thresholds
        run: |
          # Update coverage/lcov.info with merged data for checkCoverage.js
          cp lcov_merged.info coverage/lcov.info
          node scripts/checkCoverage.js
        continue-on-error: false

      - name: Upload merged coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./lcov_merged.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload merged coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-coverage-report
          path: |
            lcov_foundry.info
            lcov_hardhat.info
            lcov_merged.info
            coverage_merged/

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('coverage/coverage-summary.json')) {
              const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json'));
              const lines = coverage.total.lines.pct;
              const branches = coverage.total.branches.pct;
              const functions = coverage.total.functions.pct;

              const comment = `## 📊 Coverage Report\n\n` +
                `| Metric | Coverage | Target | Status |\n` +
                `|--------|----------|--------|--------|\n` +
                `| Lines | ${lines}% | 90% | ${lines >= 90 ? '✅' : '❌'} |\n` +
                `| Branches | ${branches}% | 80% | ${branches >= 80 ? '✅' : '❌'} |\n` +
                `| Functions | ${functions}% | 85% | ${functions >= 85 ? '✅' : '❌'} |\n\n` +
                `[View detailed coverage report](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  # ==========================================
  # Job 4: Gas回归测试
  # ==========================================
  gas-regression:
    name: Gas Regression Check
    runs-on: ubuntu-latest
    needs: [foundry-coverage]
    
    container:
      image: node:20-bookworm
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          apt-get update && apt-get install -y git python3 make g++ curl
          rm -rf /var/lib/apt/lists/*

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Setup yarn
        run: |
          corepack enable
          corepack prepare yarn@4.3.0 --activate

      - name: Install dependencies
        env:
            YARN_ENABLE_HARDENED_MODE: false
        run: |
          # Force node_modules mode
          rm -rf node_modules .yarn/cache .yarn/unplugged
          yarn config set nodeLinker node-modules
          yarn install --immutable
          # Fallback to npm if node_modules not created
          if [ ! -d "node_modules" ]; then
            npm install
          fi

      - name: Gas regression check
        run: |
          if [ -f ".gas-snapshot" ]; then
            echo "Checking for gas regressions in source functions..."
            # 检查Gas回归 - 5%阈值
            forge snapshot --match-test "testSwap|testCreateDeposit|testCreateWithdrawal|testGetPriceImpact|testGetSwapFees" --via-ir --optimize false --check
            echo "✅ Gas regression check passed"
          else
            echo "❌ No baseline gas snapshot found"
            exit 1
          fi
        id: gas_check
        continue-on-error: true

      # - name: Upload gas comparison
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: gas-comparison
      #     path: .gas-snapshot


  # ==========================================
  # Job 5: 成功状态检查
  # ==========================================
  qa-success:
    name: QA Pipeline Success
    runs-on: ubuntu-latest
    needs: [foundry-coverage, hardhat-coverage, merge-coverage, gas-regression]
    if: success()

    steps:
      - name: Success message
        run: |
          echo "✅ All QA checks passed!"
          echo "- Foundry coverage: PASSED"
          echo "- Hardhat coverage: PASSED"
          echo "- Merged coverage targets: MET"
          echo "- Gas regression: PASSED"

  # ==========================================
  # Job 6: 失败通知
  # ==========================================
  qa-failure:
    name: QA Pipeline Failure
    runs-on: ubuntu-latest
    needs: [foundry-coverage, hardhat-coverage, merge-coverage, gas-regression]
    if: failure()

    steps:
      - name: Failure message
        run: |
          echo "❌ QA checks failed!"
          echo "Please review the failed jobs above."
          exit 1
